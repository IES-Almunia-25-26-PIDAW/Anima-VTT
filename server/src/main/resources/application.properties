spring.application.name=Proyecto

# File uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads

# Connection
server.port=1000

# Datasource
spring.datasource.url=jdbc:sqlite:database.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=admon
spring.datasource.password=1234

# Hibernate JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional: log SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Serve the Vite-built frontend from the same port.
# Run "pnpm build:web" in client/ first; server must be started from Server/ directory.
spring.web.resources.static-locations=file:../client/packages/web/dist/,classpath:/static/